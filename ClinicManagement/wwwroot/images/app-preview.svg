<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phòng khám An Tâm preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="1" stop-color="#e2f0f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#12343b" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="72" y="70" width="1056" height="490" rx="32" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="118" y="120" width="120" height="120" rx="26" fill="#ffffff" stroke="#fecaca" stroke-width="8"/>
  <rect x="166" y="142" width="24" height="76" rx="5" fill="#dc2626"/>
  <rect x="140" y="168" width="76" height="24" rx="5" fill="#dc2626"/>
  <text x="278" y="168" fill="#0f2f36" font-family="Arial, sans-serif" font-size="54" font-weight="700">Phòng khám An Tâm</text>
  <text x="278" y="220" fill="#0b655e" font-family="Arial, sans-serif" font-size="28" font-weight="700">Hệ thống quản lý phòng khám</text>
  <text x="118" y="318" fill="#213f46" font-family="Arial, sans-serif" font-size="34" font-weight="700">Tiếp nhận bệnh nhân, đặt lịch khám, hồ sơ khám,</text>
  <text x="118" y="362" fill="#213f46" font-family="Arial, sans-serif" font-size="34" font-weight="700">hóa đơn và thống kê.</text>
  <g fill="#e6f7ee" stroke="#0b8f63" stroke-width="3">
    <rect x="118" y="410" width="225" height="68" rx="18"/>
    <rect x="373" y="410" width="225" height="68" rx="18"/>
    <rect x="628" y="410" width="225" height="68" rx="18"/>
  </g>
  <g fill="#173f31" font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <text x="148" y="453">Đặt lịch khám</text>
    <text x="403" y="453">Hồ sơ bệnh án</text>
    <text x="658" y="453">Thống kê báo cáo</text>
  </g>
</svg>
